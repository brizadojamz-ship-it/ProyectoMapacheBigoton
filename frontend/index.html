<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | El Mapache Bigotón</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar">
            <div class="logo">
                <h2>El Mapache</h2>
                <span>BIGOTÓN</span>
            </div>
            
            <nav class="menu">
                <ul>
                    <li class="active"><a href="index.html">Inicio</a></li>
                    <li><a href="citas.html">Citas</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="barberos.html">Barberos</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="avatar">EM</div>
                <div class="info">
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <main class="main-content" id="resumen-dashboard">
            
            <section class="stats-cards">
                <div class="card">
                    <div class="card-info">
                        <p class="card-title">Citas de hoy</p>
                        <div class="card-data">
                            <h3 id="citas-hoy">0</h3>
                            <span>Agenda activa</span>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-info">
                        <p class="card-title">Ingresos estimados</p>
                        <div class="card-data">
                            <h3 id="ingresos-hoy">$0</h3>
                            <span>Según servicios</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="appointments-list" style="margin-top: 30px;">
                <h2>Agenda de hoy</h2>
                <div id="lista-agenda"></div>
            </section>
            
        </main>
    </div>

    <script src="JavaScript/main.js"></script>
</body>
</html>
