<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | El Mapache Bigotón</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="logo">
                <h2>El Mapache</h2>
                <span>BIGOTÓN</span>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li class="active"><a href="citas.html">Citas</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="barberos.html">Barberos</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="avatar">EM</div>
                <div class="info">
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="title-section">
                    <span class="subtitle">RESUMEN DIARIO</span>
                    <h1>Agenda de hoy</h1>
                    <p class="date" id="fecha-actual">Cargando fecha...</p>
                </div>
                <div class="actions-section">
                    <button class="btn-primary" onclick="abrirModalCita()">+ Nueva cita</button>
                </div>
            </header>

            <section class="stats-cards">
                <div class="card">
                    <div class="card-info">
                        <p class="card-title">Citas de hoy</p>
                        <div class="card-data">
                            <h3 id="stats-citas-hoy">0</h3>
                            <span>Agenda activa</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-info">
                        <p class="card-title">Ingresos estimados</p>
                        <div class="card-data">
                            <h3 id="stats-ingresos-hoy">$0</h3>
                            <span>Según servicios</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-info">
                        <p class="card-title">Próxima cita</p>
                        <div class="card-data">
                            <h3 id="stats-proxima-hora">--:--</h3>
                            <span id="stats-proxima-cliente">Sin citas</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="appointments-list" style="margin-top: 30px;">
                <h2>Citas programadas</h2>
                <div id="lista-citas"></div>

            </section>
        </main>
    </div>
    <div id="modal-cita" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModalCita()">&times;</span>
            <h2 style="margin-bottom: 20px;">Agendar Nueva Cita</h2>

            <form id="form-cita" onsubmit="guardarCita(event)">
                <div class="form-group">
                    <label>Cliente:</label>
                    <select id="cita-cliente" required></select>
                </div>

                <div class="form-group">
                    <label>Barbero:</label>
                    <select id="cita-barbero" required></select>
                </div>

                <div class="form-group">
                    <label>Servicio:</label>
                    <select id="cita-servicio" required></select>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="width: 50%;">
                        <label>Fecha:</label>
                        <input type="date" id="cita-fecha" required>
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label>Hora:</label>
                        <input type="time" id="cita-hora" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;">Guardar
                    Cita</button>
            </form>
        </div>
    </div>
    <script src="JavaScript/main.js"></script>
</body>

</html>
