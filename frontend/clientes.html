<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | El Mapache Bigotón</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="logo">
                <h2>El Mapache</h2>
                <span>BIGOTÓN</span>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="citas.html">Citas</a></li>
                    <li class="active"><a href="clientes.html">Clientes</a></li>
                    <li><a href="barberos.html">Barberos</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="avatar">EM</div>
                <div class="info">
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="title-section">
                    <span class="subtitle">DIRECTORIO</span>
                    <h1>Clientes</h1>
                    <p class="card-title" style="margin-top: 5px;">Administra la información y mantén tus registros
                        siempre actualizados.</p>
                </div>
                <div class="actions-section">
                    <button class="btn-primary" onclick="abrirModalCliente()">+ Nuevo cliente</button>
                </div>
            </header>

            <section class="appointments-list" style="margin-top: 30px;">
                <div id="lista-clientes"></div>
            </section>
        </main>
    </div>

    <div id="modal-cliente" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModalCliente()">&times;</span>
            <h2 style="margin-bottom: 20px;">Agregar Nuevo Cliente</h2>

            <form id="form-cliente" onsubmit="guardarCliente(event)">
                <div class="form-group">
                    <label>Nombre del Cliente:</label>
                    <input type="text" id="cliente-nombre" required placeholder="Ej. Diana Lozano">
                </div>
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="text" id="cliente-telefono" required placeholder="Ej. 2311501210">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;">Guardar
                    Cliente</button>
            </form>
        </div>
    </div>

    <script src="JavaScript/main.js"></script>
</body>

</html>
